<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de divisas para frontera Venezuela-Colombia">
    <meta name="theme-color" content="#2c3e50">
    <title>Calculadora Frontera</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>">
</head>
<body>
    <header class="header">
        <h1 id="companyName">Mi Negocio</h1>
        <a href="config.html" class="config-btn" aria-label="Configuración">⚙️</a>
    </header>

    <main class="main">
        <!-- Display principal: grande volteado para cliente + pequeño normal para vendedor -->
        <section class="display-section">
            <!-- Display volteado 180° para el cliente (frente a frente) -->
            <div class="main-display customer-display" aria-live="polite" role="status">
                <span class="currency-symbol" id="displaySymbol">$</span>
                <span class="display-amount" id="displayAmount">0</span>
                <span class="display-currency" id="displayCurrency">COP</span>
                <span class="pending-op" id="pendingOp" aria-hidden="true"></span>
            </div>
            
            <!-- Copia pequeña en orientación normal para el vendedor -->
            <div class="seller-display" aria-hidden="true">
                <span class="seller-label">Tu vista:</span>
                <span class="currency-symbol" id="sellerSymbol">$</span>
                <span class="seller-amount" id="sellerAmount">0</span>
                <span class="seller-currency" id="sellerCurrency">COP</span>
                <span class="seller-pending" id="sellerPending"></span>
            </div>
            
            <div class="sub-display" id="subDisplay" aria-hidden="true"></div>
        </section>

        <!-- Teclado numérico -->
        <section class="keypad-section">
            <div class="keypad-grid">
                <button class="key key-num" data-key="7" aria-label="7">7</button>
                <button class="key key-num" data-key="8" aria-label="8">8</button>
                <button class="key key-num" data-key="9" aria-label="9">9</button>
                <button class="key key-action key-add" data-action="add" aria-label="Sumar">+</button>

                <button class="key key-num" data-key="4" aria-label="4">4</button>
                <button class="key key-num" data-key="5" aria-label="5">5</button>
                <button class="key key-num" data-key="6" aria-label="6">6</button>
                <button class="key key-action key-subtract" data-action="subtract" aria-label="Restar">−</button>

                <button class="key key-num" data-key="1" aria-label="1">1</button>
                <button class="key key-num" data-key="2" aria-label="2">2</button>
                <button class="key key-num" data-key="3" aria-label="3">3</button>
                <button class="key key-action key-clear" data-action="clear" aria-label="Limpiar todo">C</button>

                <button class="key key-num key-zero" data-key="0" aria-label="0">0</button>
                <button class="key key-num" data-key="." aria-label="Decimal">.</button>
                <button class="key key-action key-undo" data-action="undo" aria-label="Deshacer último">⌫</button>
                <button class="key key-action key-total" data-action="total" aria-label="Ver totales en todas las monedas">=</button>
            </div>
        </section>

        <!-- Cinta de operaciones (tape) -->
        <section class="tape-section">
            <div class="tape-header">
                <h3>Operaciones</h3>
                <button id="clearTapeBtn" class="btn-ghost" aria-label="Limpiar cinta">🗑️</button>
            </div>
            <ul id="tapeList" class="tape-list" aria-live="polite"></ul>
            <div id="emptyTape" class="empty-tape">Sin operaciones aún</div>
        </section>

        <!-- Totales en todas las monedas (compacto) -->
        <section class="totals-section" id="totalsSection" hidden>
            <h3>Totales en todas las monedas</h3>
            <div class="totals-grid" id="totalsGrid"></div>
            <button id="hideTotalsBtn" class="btn-secondary">Ocultar totales</button>
        </section>
    </main>

    <footer class="footer">
        <p id="footerText">Datos guardados localmente</p>
    </footer>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(console.error);
        }
    </script>
</body>
</html>
