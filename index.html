<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1A1A2E">
    <meta name="description" content="Calculadora de divisas para frontera Venezuela-Colombia">
    <title>Calculadora Frontera</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>">
</head>
<body>
    <!-- Top App Bar -->
    <header class="md3-top-app-bar" role="banner">
        <div class="md3-top-app-bar__content">
            <span class="md3-top-app-bar__title" id="companyName">Mi Negocio</span>
        </div>
        <a href="config.html" class="md3-icon-button md3-top-app-bar__action" aria-label="Configuración">
            <span class="material-symbols-rounded">settings</span>
        </a>
    </header>

    <main class="md3-main" role="main">
        <!-- Display Dual Section -->
        <section class="md3-display-section" aria-live="polite">
            <!-- Cliente Display (Volteado 180°) -->
            <div class="md3-customer-display" role="status" aria-label="Total para el cliente">
                <div class="md3-customer-display__inner">
                    <span class="md3-customer-display__currency" id="displaySymbol">$</span>
                    <span class="md3-customer-display__amount" id="displayAmount">0</span>
                    <span class="md3-customer-display__currency-code" id="displayCurrency">COP</span>
                    <span class="md3-customer-display__pending" id="pendingOp" aria-hidden="true"></span>
                </div>
            </div>

            <!-- Separador visual -->
            <div class="md3-display-divider" aria-hidden="true"></div>

            <!-- Vendedor Display (Normal) -->
            <div class="md3-seller-display" aria-hidden="true">
                <span class="md3-seller-display__label">Tu vista</span>
                <span class="md3-seller-display__currency" id="sellerSymbol">$</span>
                <span class="md3-seller-display__amount" id="sellerAmount">0</span>
                <span class="md3-seller-display__currency-code" id="sellerCurrency">COP</span>
                <span class="md3-seller-display__pending" id="sellerPending"></span>
            </div>

            <!-- Sub-display: Total acumulado + operación actual -->
            <div class="md3-sub-display" id="subDisplay" aria-hidden="true"></div>
        </section>

        <!-- Keypad Section -->
        <section class="md3-keypad-section">
            <div class="md3-keypad-grid" role="group" aria-label="Teclado numérico">
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="7" aria-label="7">
                    <span class="md3-button__label">7</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="8" aria-label="8">
                    <span class="md3-button__label">8</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="9" aria-label="9">
                    <span class="md3-button__label">9</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled-tonal md3-keypad-key md3-keypad-key--action md3-keypad-key--add" data-action="add" aria-label="Sumar">
                    <span class="material-symbols-rounded md3-button__icon">add</span>
                    <span class="md3-button__ripple"></span>
                </button>

                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="4" aria-label="4">
                    <span class="md3-button__label">4</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="5" aria-label="5">
                    <span class="md3-button__label">5</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="6" aria-label="6">
                    <span class="md3-button__label">6</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled-tonal md3-keypad-key md3-keypad-key--action md3-keypad-key--subtract" data-action="subtract" aria-label="Restar">
                    <span class="material-symbols-rounded md3-button__icon">remove</span>
                    <span class="md3-button__ripple"></span>
                </button>

                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="1" aria-label="1">
                    <span class="md3-button__label">1</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="2" aria-label="2">
                    <span class="md3-button__label">2</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="3" aria-label="3">
                    <span class="md3-button__label">3</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--outlined md3-keypad-key md3-keypad-key--action md3-keypad-key--clear" data-action="clear" aria-label="Limpiar todo">
                    <span class="md3-button__label">C</span>
                    <span class="md3-button__ripple"></span>
                </button>

                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number md3-keypad-key--zero" data-key="0" aria-label="0">
                    <span class="md3-button__label">0</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--filled md3-keypad-key md3-keypad-key--number" data-key="." aria-label="Decimal">
                    <span class="md3-button__label">.</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--outlined md3-keypad-key md3-keypad-key--action md3-keypad-key--undo" data-action="undo" aria-label="Deshacer último">
                    <span class="material-symbols-rounded md3-button__icon">backspace</span>
                    <span class="md3-button__ripple"></span>
                </button>
                <button class="md3-button md3-button--elevated md3-keypad-key md3-keypad-key--action md3-keypad-key--total" data-action="total" aria-label="Ver totales en todas las monedas">
                    <span class="md3-button__label">=</span>
                    <span class="md3-button__ripple"></span>
                </button>
            </div>
        </section>

        <!-- Tape Section (Scrollable) -->
        <section class="md3-tape-section" aria-label="Historial de operaciones">
            <header class="md3-tape-header">
                <h2 class="md3-tape-header__title">Operaciones</h2>
                <button class="md3-icon-button md3-tape-header__action" id="clearTapeBtn" aria-label="Limpiar historial">
                    <span class="material-symbols-rounded">delete_sweep</span>
                </button>
            </header>
            <ul class="md3-tape-list" id="tapeList" role="list"></ul>
            <div class="md3-empty-state" id="emptyTape" aria-hidden="true">
                <span class="material-symbols-rounded md3-empty-state__icon">receipt_long</span>
                <p class="md3-empty-state__text">Sin operaciones aún</p>
            </div>
        </section>

        <!-- Totals Bottom Sheet -->
        <section class="md3-bottom-sheet" id="totalsSection" hidden role="dialog" aria-label="Totales en todas las monedas" aria-modal="true">
            <div class="md3-bottom-sheet__handle" aria-hidden="true"></div>
            <header class="md3-bottom-sheet__header">
                <h2 class="md3-bottom-sheet__title">Totales en todas las monedas</h2>
                <button class="md3-icon-button md3-bottom-sheet__close" id="hideTotalsBtn" aria-label="Cerrar">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </header>
            <div class="md3-bottom-sheet__content">
                <div class="md3-totals-grid" id="totalsGrid"></div>
            </div>
        </section>
    </main>

    <!-- Scrim for bottom sheet -->
    <div class="md3-scrim" id="scrim" hidden></div>

    <footer class="md3-footer">
        <p id="footerText">Datos guardados localmente</p>
    </footer>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(console.error);
        }
    </script>
</body>
</html>
